name: Playwright Java Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # lets you run it manually from GitHub
  schedule:
  - cron: '43 6 * * *'     # daily, 18:30 UTC = 00:00 IST

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile project
        run: mvn -B clean compile test-compile

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B test -Dheadless=true

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 14